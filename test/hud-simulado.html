<body>
<div id="controles">
  <button id="b-loja">Loja (B)</button>
  <button id="b-tab">Placar (Tab)</button>
  <button id="b-m">Tecla M</button>
  <button id="b-f6">Tecla F6</button>
  <button id="b-esc">Menu ESC</button>

  <button id="b-tempo">+5 min</button>

<script>
// ======================= Panorama falso =======================
const logEl = document.getElementById("log");
const msgs = [];
const handlersEv = {};      // RegisterForUnhandledEvent
const comandos = [];        // CitadelConCommand recebidos
let clipboard = "";
class FakePanel {
  constructor(tipo, pai, id) {
    this.paneltype = tipo; this.id = id || ""; this._kids = []; this._classes = new Set(); this._valid = true; this._ev = {};
    this.el = document.createElement(tipo === "Label" ? "span" : tipo === "TextEntry" ? "input" : "div");
    if (tipo === "Label") this.el.style.display = "block";
    if (id) this.el.id = id;
    this.el.className = "p-" + tipo;
    // style inline como no Panorama: width/height e position "Xpx Ypx 0px" (canto superior esquerdo)
    const el_ = this.el;
    this.style = new Proxy({}, { set(t, k, v) {
      t[k] = v;
      if (k === "width" || k === "height" || k === "border" || k === "backgroundColor") el_.style[k] = v || "";
      if (k === "position" && v) { const [x, y] = v.split(" "); el_.style.position = "absolute"; el_.style.left = x; el_.style.top = y; }
      return true;
    } });
    this.visible = true;
    if (pai) pai._add(this);
    if (tipo === "TextEntry") this.el.addEventListener("input", () => this._fire("ontextentrychange"));
  }
  _add(c) { c.parent = this; this._kids.push(c); this.el.appendChild(c.el); }
  _sync() {
    const extra = [...this.el.classList].filter((c) => ["fake", "lojaSim", "navSim", "listasSim", "sim", "aberto"].includes(c));
    this.el.className = ["p-" + this.paneltype, ...extra, ...this._classes].join(" ");
  }
  _fire(n, ...a) { (this._ev[n] || []).forEach((f) => f(...a)); }
  get text() { return this.paneltype === "TextEntry" ? this.el.value : (this._text || ""); }
  set text(v) { this._text = v; if (this.paneltype === "TextEntry") this.el.value = v; else if (this.paneltype === "Label") this.el.innerHTML = v; }
  IsValid() { return this._valid; }
  Children() { return this._kids.slice(); }
  GetParent() { return this.parent; }
  AddClass(c) { this._classes.add(c); this._sync(); }
  RemoveClass(c) { this._classes.delete(c); this._sync(); }
  SetHasClass(c, on) { on ? this.AddClass(c) : this.RemoveClass(c); }
  BHasClass(c) { return this._classes.has(c); }
  FindChildTraverse(id) { for (const k of this._kids) { if (k.id === id) return k; const r = k.FindChildTraverse(id); if (r) return r; } return null; }
  FindChildrenWithClassTraverse(c) { const out = []; const rec = (p) => p._kids.forEach((k) => { if (k._classes.has(c)) out.push(k); rec(k); }); rec(this); return out; }
  GetAttributeString(n, d) { return this[n] || d; }
  MoveChildAfter(a, b) { b.el.after(a.el); }
  MoveChildBefore(a, b) { this._kids = this._kids.filter((k) => k !== a); this._kids.splice(this._kids.indexOf(b), 0, a); b.el.before(a.el); }
  SetParent(novo) {
    if (this.parent) this.parent._kids = this.parent._kids.filter((k) => k !== this);
    novo._add(this);
  }
  GetPositionWithinWindow() { const r = this.el.getBoundingClientRect(); return { x: r.left, y: r.top }; }
  get actualuiscale_x() { return 1; }
  get actuallayoutwidth() { return this.el.offsetWidth; }
  get hittest() { return this._hittest !== false; }
  set hittest(v) { this._hittest = !!v; this.el.style.pointerEvents = v ? "" : "none"; }
  RemoveAndDeleteChildren() { this._kids.forEach((k) => { k._valid = false; k.el.remove(); }); this._kids = []; }
  DeleteAsync() { this._valid = false; this.el.remove(); if (this.parent) this.parent._kids = this.parent._kids.filter((k) => k !== this); }
  SetImage(s) {
    this.src = s; this.el.dataset.src = s.replace(/^.*\//, "").replace("_psd.vtex", "");
    // prévia: os ícones reais do jogo, convertidos pelo Source2Viewer em test/icones/
    const m = /panorama\/images\/(?:.*\/)?([A-Za-z0-9_]+)\.(vtex|vsvg)$/.exec(s);
    if (m) { this.el.style.backgroundImage = "url(icones/" + m[1] + (m[2] === "vsvg" ? ".svg" : ".png") + ")"; this.el.classList.add("comPng"); }
  }
  SetPanelEvent(ev, fn) {
    const map = { onmouseactivate: "click", onactivate: "click", onmouseover: "mouseenter", onmouseout: "mouseleave" };
    if (map[ev]) this.el.addEventListener(map[ev], (e) => { e.stopPropagation(); fn(); });
    else (this._ev[ev] = this._ev[ev] || []).push(fn);
  }
  BLoadLayout(arquivo) {
    const nome = arquivo.replace(/^.*deadlock_utils_/, "");
    const xhr = new XMLHttpRequest();
    xhr.open("GET", "../mod/layout/" + nome, false); xhr.send();
    if (xhr.status !== 200) return false;
    const doc = new DOMParser().parseFromString(xhr.responseText, "text/xml");
    const raizXml = [...doc.documentElement.children].find((n) => n.tagName !== "styles");
    const montar = (no, painel) => {
      (no.getAttribute("class") || "").split(" ").filter(Boolean).forEach((c) => painel.AddClass(c));
      if (no.getAttribute("text") != null) painel.text = no.getAttribute("text");
      if (no.getAttribute("src")) painel.SetImage(no.getAttribute("src"));
      if (no.getAttribute("hittest") === "false") painel.hittest = false;
      if (no.getAttribute("hittestchildren") === "false") painel.el.classList.add("semFilhos");
      [...no.children].forEach((f) => montar(f, new FakePanel(f.tagName, painel, f.getAttribute("id") || "")));
    };
    montar(raizXml, this);
    return true;
  }
  SetAttributeString(n, v) { this[n] = v; }
  // CitadelHTMLPanel falso: carrega a página real (mod/pagina/ponte.html) num iframe; pedidos pelo
  // fragmento da URL, respostas pelo título (fetch real ao deadlock-api).
  SetURL(url) {
    const [base, hash] = url.split("#");
    if (!this._iframe) {
      this._iframe = document.createElement("iframe");
      this._iframe.style.display = "none";
      this._iframe.src = base + (hash ? "#" + hash : "");
      document.body.appendChild(this._iframe);
      let ultimo = "";
      setInterval(() => {
        try { const t = this._iframe.contentDocument.title; if (t !== ultimo) { ultimo = t; this._fire("HTMLTitle", t); this._fire("HTMLTitle", t); } } catch (e) {}
      }, 40);
    } else if (hash) this._iframe.contentWindow.location.hash = hash;
  }
}
const raiz = new FakePanel("Panel", null, "Hud");
document.getElementById("tela").appendChild(raiz.el);
if (location.search.indexOf("ponte=1") >= 0) window.DU_URL_PONTE_TESTE = location.origin + "/mod/pagina/ponte.html";
const keyBinds = {};

window.$ = {
  GetContextPanel: () => raiz,
  CreatePanel: (t, p, id) => new FakePanel(t, p, id),
  RegisterKeyBind: (p, key, fn) => { (keyBinds[key] = keyBinds[key] || []).push(fn); },
  CreatePanelWithProperties: (t, p, id, props) => { const x = new FakePanel(t, p, id); if (props && props.placeholder && t === "TextEntry") x.el.placeholder = props.placeholder; return x; },
  Schedule: (s, fn) => setTimeout(fn, s * 250), // 4x mais rápido
  Msg: (m) => { msgs.push(m); logEl.textContent = msgs.slice(-80).join("\n"); },
  RegisterForUnhandledEvent: (n, fn) => { (handlersEv[n] = handlersEv[n] || []).push(fn); },
  RegisterEventHandler: (n, p, fn) => { (p._ev[n] = p._ev[n] || []).push(fn); },
  DispatchEvent: (n, ...a) => {
    if (n === "CitadelConCommand") {
      const cmd = a[0]; comandos.push(cmd);
      let m = /^panorama_dispatch_event (\w+)\(\)$/.exec(cmd);  // o simulador aceita só o formato 0
      if (m) (handlersEv[m[1]] || []).forEach((f) => f());
      m = /^bind "(\w+)" "panorama_dispatch_event (\w+)\(\)"$/.exec(cmd);
      if (m) teclas[m[1].toLowerCase()] = m[2];
      if (cmd === "+show_scoreboard") topBar.AddClass("gScoreboardOpen");
      if (cmd === "-show_scoreboard") topBar.RemoveClass("gScoreboardOpen");
    }
    if (n === "CopyStringToClipboard") clipboard = a[0];
    // Compra simulada: só "Activated" funciona (para testar a escolha de método) e só se puder pagar.
    if (n === "Activated" && a[0] && a[0].paneltype === "CitadelShopMod" && a[0].BHasClass("canAffordMod")) a[0].AddClass("owned");
    if (n === "CitadelResumePlaying") { esc.RemoveClass("aberto"); raiz.RemoveClass("ShowEscapeMenu"); }
  },
};

const teclas = {};
// Como o jogo: a tecla chama todos os RegisterKeyBind dela (o mod registra 2x e precisa ignorar o repetido).
function tecla(t) {
  const fns = keyBinds["key_" + t] || [];
  if (fns.length) { fns.forEach((f) => f()); return; }
  const ev = teclas[t]; if (ev) (handlersEv[ev] || []).forEach((f) => f()); else alert("tecla " + t + " sem bind");
}

function el(t, pai, id, classes, props) { const p = new FakePanel(t, pai, id); (classes || "").split(" ").filter(Boolean).forEach((c) => p.AddClass(c)); Object.assign(p, props || {}); p.el.classList.add("fake"); return p; }
function real(p, ...cls) { p.el.classList.remove("fake"); cls.forEach((c) => p.el.classList.add(c)); return p; }

for (let i = 0; i < 6; i++) el("Panel", el("Panel", intCont, "PlayerIntentsPlayer" + i), "", "", {});

const relogioLbl = el("Label", topBar, "GameTime", "", { text: "8:15" });
el("Label", topBar, "MidbossTimerLabel", "", { text: "2:40" });

  p._icones = ic;
  icones.forEach((s) => comprar(p, s));
  return p;
}
function comprar(p, k) { el("Image", el("Panel", el("Panel", p._icones, "", "CitadelModIcon"), "mod_icon_background"), "ModIconImage", "", { src: "s2r://panorama/images/" + k + "_psd.vtex" }); }

  .map(([h, n, i]) => jogador(inimigos, h, n, i));
