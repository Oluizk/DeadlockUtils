  .forEach(([h, n, i], k) => { const p = jogador(amigos, h, n, i); p.AddClass("friend"); p.AddClass(TROCADO ? "team2" : "team1"); if (k === 0) { p.AddClass("IsLocalPlayer"); el("Label", p, "SoulsValue", "", { text: "1,6 mil" }); } });
const inimigos = el("Panel", el("Panel", times, TROCADO ? "TeamFriendly" : "TeamEnemy"), "PlayersContainer");
if (TROCADO) times.MoveChildBefore(inimigos.parent, amigos.parent);
const ini = [["Abrams", "Ini1", ["items/vitality/leech"]], ["Haze", "Ini2", []], ["Seven", "Ini3", ["items/spirit/knockdown"]], ["Lady Geist", "Ini4", []], ["Dynamo", "Ini5", []], ["Lash", "Ini6", []]]
  .map(([h, n, i]) => jogador(inimigos, h, n, i));
ini.forEach((p, k) => { p.AddClass("enemy"); p.AddClass(TROCADO ? "team1" : "team2"); if (k === 2) p.RemoveClass("HealthVisible"); }); // Seven fora de visão
// minimapa
const persp = real(el("Panel", raiz, "minimap_persp"), "sim");
const mmCont = el("Panel", persp, "minimap_container");
el("Panel", mmCont, "minimap_frame");
// #hud_minimap com a imagem REAL do minimapa (data do deadlock-api) para conferir o alinhamento dos pontos.
const hudMinimap = real(el("Panel", el("Panel", mmCont, "HudMinimapContainer"), "hud_minimap", "HudMinimap"), "sim");
[mmCont, hudMinimap.parent].forEach((p) => real(p));
if (location.search.indexOf("invertido=1") >= 0) hudMinimap.AddClass("invert_map");
// como no hud_minimap.xml: as imagens do mapa ficam num painel próprio, separado dos ícones
const fundoSim = real(el("Panel", hudMinimap, "MinimapBackgroundTest"), "simFundoCont");
real(el("Image", fundoSim, "", "can_zoom backgroundImage1"), "simFundoMapa");
el("Image", fundoSim, "", "can_zoom backgroundImage2");
real(el("Panel", fundoSim, "canvas"), "simCanvas");
// indicador do jogador local como no jogo (hud_minimap.css: .map_button.localplayer.friend = 15%)
real(el("Panel", hudMinimap, "", "map_button player localplayer friend"));
real(el("Panel", hudMinimap, "", "map_button player enemy"));
// objetivos no minimapa (hud_minimap.css): locais dos buffs da ponte, chefe do meio
const buffsPonte = [el("Panel", hudMinimap, "", "map_button powerup_spawn"), el("Panel", hudMinimap, "", "map_button powerup_spawn")];
el("Panel", hudMinimap, "", "map_button mid_boss");
// menu ESC
const esc = real(el("Panel", raiz, "EscapeMenu"), "sim");
const menuEsc = real(el("Panel", esc, "Menu"));
real(el("Panel", real(el("Panel", esc, "SubOptions")), "", "FeedbackRow"));
const changehero = real(el("Button", menuEsc, "changehero", "nav_menu_item"));
changehero.el.textContent = "Trocar herói";
// loja
const shop = real(el("Panel", raiz, "CitadelHudHeroShop", "CitadelHudHeroShop"), "lojaSim");
const shopMods = el("Panel", el("Panel", el("Panel", shop, "Shop"), "MainPanel"), "ShopModsContainer");
[shopMods.parent.parent, shopMods.parent, shopMods].forEach((p) => real(p));
const hp = el("Panel", shopMods.parent.parent, "HeroPanel"); el("Image", hp, "HeroImage", "", { src: "" });
const navSim = real(el("Panel", shopMods, "ShopNavigation"), "navSim");
const listasSim = real(el("Panel", shopMods, "ShopModListsContainer"), "listasSim");
const abasJogo = { FavoritesNav: "showingFavorites", RecommendedNav: "showingRecommendations", FilteredNav: "showingAllItems", WeaponNav: "showingWeapon", TechNav: "showingTech", ArmorNav: "showingArmor" };
Object.entries(abasJogo).forEach(([id, cls]) => {
  const b = real(el("Panel", navSim, id, "NavigationButton"));
  b.el.prepend(document.createTextNode(id.replace("Nav", "")));
  // Como o jogo: só muda algo se a aba for diferente da atual.
  b.el.addEventListener("click", () => { if (shop.BHasClass(cls)) return; Object.values(abasJogo).forEach((c) => shop.RemoveClass(c)); shop.AddClass(cls); });
});
shop.AddClass("showingArmor");
// Lista "todos os itens" da loja com um CitadelShopMod nativo por item (como o jogo cria).
const listaNativa = el("Panel", el("Panel", listasSim, "ShopModsFiltered"), "ModTiers");
const NATIVOS = (() => { const x = new XMLHttpRequest(); x.open("GET", "../data/items.json", false); x.send(); return JSON.parse(x.responseText).itens; })();
NATIVOS.forEach((it, i) => {
  const m = el("CitadelShopMod", listaNativa, "", i % 3 === 0 ? "canAffordMod" : "");
  const SEMSRC = location.search.indexOf("semsrc=1") >= 0; // como no jogo: src vazio, só o nome no cartão
  el("Image", el("Panel", m, "ModCard"), "ModIconImage", "", { src: SEMSRC ? "" : "s2r://panorama/images/" + it.icones.filter((k) => k.startsWith("items/"))[0] + "_psd.vtex" });
  el("Label", el("Panel", m, "", "mod_name_area"), "", "modName", { text: it.nome_pt });
  m.el.classList.remove("fake"); m.el.classList.add("nativoSim"); m.el.textContent = "N:" + it.nome;
});
shop.el.style.display = "none";

document.getElementById("b-loja").onclick = () => { const a = !topBar.BHasClass("gShopOpen"); topBar.SetHasClass("gShopOpen", a); shop.SetHasClass("gShopOpen", a); shop.el.style.display = a ? "block" : "none"; };
document.getElementById("b-tab").onclick = () => topBar.SetHasClass("gScoreboardOpen", !topBar.BHasClass("gScoreboardOpen"));
document.getElementById("b-m").onclick = () => tecla("m");
document.getElementById("b-f6").onclick = () => tecla("f6");
// Como no jogo: o menu ESC aberto marca a raiz do HUD com ShowEscapeMenu.
document.getElementById("b-esc").onclick = () => { const a = !esc.BHasClass("aberto"); esc.SetHasClass("aberto", a); raiz.SetHasClass("ShowEscapeMenu", a); };
document.getElementById("b-curse").onclick = () => comprar(ini[4], "items/spirit/curse");
document.getElementById("b-tempo").onclick = () => { const s = segundos() + 300; relogioLbl.text = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
document.getElementById("b-f9").onclick = () => tecla("f9");
document.getElementById("b-dano").onclick = () => definirVida(vidaAtual - 350);
document.getElementById("b-cura").onclick = () => definirVida(vidaAtual + 350);
document.getElementById("b-ponte").onclick = () => { const on = !buffsPonte[0].BHasClass("powerup_gun"); buffsPonte[0].SetHasClass("powerup_gun", on); buffsPonte[1].SetHasClass("powerup_casting", on); };
document.getElementById("b-urna").onclick = () => {
  const u = hudMinimap.FindChildrenWithClassTraverse("idol_spawn")[0];
  if (u) u.DeleteAsync(); else el("Panel", hudMinimap, "", "map_button idol_spawn");
};
// como o jogo: o estado vai em classes na raiz do HUD (hud.css esconde o HUD dele com elas)
document.getElementById("b-pre").onclick = () => raiz.SetHasClass("GameStatePreGameWait", !raiz.BHasClass("GameStatePreGameWait"));
document.getElementById("b-hideout").onclick = () => raiz.SetHasClass("InHideout", !raiz.BHasClass("InHideout"));
// o relógio anda sozinho (1 s simulado a cada 250 ms, como o $.Schedule do simulador)
setInterval(() => { const s = segundos() + 1; relogioLbl.text = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }, 250);
function segundos() { const [m, s] = relogioLbl.text.split(":").map(Number); return m * 60 + s; }
</script>
<script>
// ?idioma=pt|es|ru faz o que o instalador faz: troca o idioma gravado no script (DU_IDIOMA).
(function () {
  const idioma = new URLSearchParams(location.search).get("idioma");
  const xhr = new XMLHttpRequest();
  xhr.open("GET", "../build/deadlock_utils.js?" + Date.now(), false); xhr.send(); // sem cache: sempre o build novo
  let js = xhr.responseText;
  if (idioma) js = js.replace(/\/\*DU_IDIOMA\*\/"[a-z]{2}"/, '/*DU_IDIOMA*/"' + idioma + '"');
  const s = document.createElement("script");
  s.text = js + "\n//# sourceURL=deadlock_utils.js";
  document.body.appendChild(s);
})();
</script>
</body>
